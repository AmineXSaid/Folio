[package]
name = "folio"
version = "0.1.0"
edition = "2021"
description = "Folio: spatial sticky notes, one canvas per category."
license = "UNLICENSED"
publish = false

[dependencies]
# GPUI Kit (Apache-2.0): GPUI's pinned snapshot plus gpui-component (inputs,
# Markdown with tables). Aliased as `gpui` so `use gpui::...` resolves.
gpui = { package = "gpui-kit", version = "=0.7.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Local dates: reminders, backups' file names, "edited 2 days ago".
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# Link cards: a pasted web address's page title (rustls, no OpenSSL).
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
# Ctrl+Alt+N from any app opens a quick note. Apache-2.0/MIT.
global-hotkey = "=0.9.0"
# Google Drive sync (src/cloud.rs): PKCE and the board's fingerprint,
# tokens' base64url, the sign-in's random values, and URL encoding. All
# MIT/Apache-2.0, all already in GPUI's tree at these versions.
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.2.17"
percent-encoding = "=2.3.2"
# A sheet as a PNG or PDF (src/picture.rs): drawn as SVG and rendered by
# resvg (Apache-2.0/MIT, with usvg and tiny-skia, BSD-3); the bundled fonts
# measured with ttf-parser (MIT/Apache-2.0); pictures decoded for the PDF
# by image and its drawing compressed by miniz_oxide (MIT/Apache-2.0).
# All already in GPUI's tree at these versions.
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
ttf-parser = "=0.25.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
miniz_oxide = "=0.8.9"

# Windows: the tray icon and its menu, and reminder notifications.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
tauri-winrt-notification = "=0.8.1"
# The tray icon's pixels, from the logo PNG (already in GPUI's tree).
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
# The Windows .exe icon (build.rs). MIT.
embed-resource = "=3.0.12"

[profile.dev]
# GPUI is heavy in debug: optimise dependencies, keep our crate quick to build.
opt-level = 0
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# GPUI's Windows renderer with its shaders compiled at runtime when the build
# had no fxc.exe (a cross-compiled .exe), from forge-gpui:
# vendor/gpui-pre-windows/FORGE-CHANGES.md. Apache-2.0.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
