<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Folio app icon: a forest tile, two stacked sticky notes in a bold ink
       outline, the front one with a peeled corner and a pinned dot. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B7A5E"/>
      <stop offset="1" stop-color="#2C5E48"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tile)"/>
  <!-- Back note: marigold, tilted left. -->
  <g transform="rotate(-9 256 256)">
    <rect x="118" y="120" width="230" height="230" rx="18" fill="#F2B544" stroke="#14201B" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <!-- Front note: cream, tilted right, with a folded corner. -->
  <g transform="rotate(6 280 290)">
    <path d="M178 170 H372 Q390 170 390 188 V322 L322 390 H196 Q178 390 178 372 Z" fill="#FBF6E9" stroke="#14201B" stroke-width="18" stroke-linejoin="round"/>
    <path d="M390 322 H340 Q322 322 322 340 V390 Z" fill="#E4DCC6" stroke="#14201B" stroke-width="18" stroke-linejoin="round"/>
    <path d="M214 222 H350 M214 266 H330 M214 310 H282" stroke="#14201B" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- The pin: a coral dot, as on the slides icon. -->
  <circle cx="356" cy="140" r="30" fill="#E8693B" stroke="#14201B" stroke-width="16"/>
</svg>
