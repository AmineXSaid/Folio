<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Folio: a pinned sticky note with a peeled corner and a highlighted
       line, cream in a heavy ink outline on a flat pink tile, with a light
       shadow behind the tile. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="40" y="36" width="432" height="432" rx="98" fill="#E5487A" filter="url(#shadow)"/>
  <g>
    <g transform="rotate(-6 256 256)" stroke="#111111" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <path d="M128 128 H384 V318 L318 384 H128 Z" fill="#F1EBDD"/>
      <path d="M384 318 H330 Q318 318 318 330 V384 Z" fill="#DDD5C4"/>
      <rect x="160" y="204" width="168" height="34" rx="4" fill="#E5487A" stroke-width="10"/>
      <path d="M168 176 H300 M168 276 H286 M168 322 H248" fill="none"/>
    </g>
    <circle cx="256" cy="128" r="24" fill="#111111"/>
  </g>
</svg>
