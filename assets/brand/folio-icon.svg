<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Folio's app icon, the vector master: a cream note in a heavy black
       outline, pinned at the top, with a pink highlight over two lines of
       writing and its corner folded, on a flat pink tile that fills the
       square as other apps' icons do. One flat drawing, the same at every
       size: the .ico has it from 16 to 256 px (scripts/icons.sh). -->
  <rect width="512" height="512" rx="100" fill="#F30D6A"/>
  <!-- The note: its outline drawn on the middle of a 33-unit black edge,
       the corner cut where it folds. -->
  <path d="M97 104.5 H417 Q424.5 104.5 424.5 112 V333 L331 426.5 H97 Q89.5 426.5 89.5 419 V112 Q89.5 104.5 97 104.5 Z" fill="#F5F2E9" stroke="#000000" stroke-width="33" stroke-linejoin="round"/>
  <!-- The folded corner. -->
  <path d="M331 426.5 V352 Q331 333 350 333 H424.5 Z" fill="#F4F0E2" stroke="#000000" stroke-width="33" stroke-linejoin="round"/>
  <!-- The pin, sitting in a notch in the paper. -->
  <path d="M206 90 A52 52 0 0 1 310 90 V118 Q310 136 292 136 H224 Q206 136 206 118 Z" fill="#000000"/>
  <!-- The highlight, and two lines of writing. -->
  <rect x="137" y="160" width="240" height="71" fill="#F30D6A"/>
  <rect x="137" y="273" width="144" height="33" fill="#000000"/>
  <rect x="137" y="347" width="93" height="31" fill="#000000"/>
</svg>
