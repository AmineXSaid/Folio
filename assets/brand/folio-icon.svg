       Chrome's and Teams' icons do) and a light shadow under it. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="14" y="8" width="484" height="484" rx="112" fill="#E5487A" filter="url(#shadow)"/>
  <g transform="translate(256 262) scale(1.2) translate(-256 -256)">
    <g transform="rotate(-6 256 256)" stroke="#111111" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <path d="M128 128 H384 V318 L318 384 H128 Z" fill="#F1EBDD"/>
      <path d="M384 318 H330 Q318 318 318 330 V384 Z" fill="#DDD5C4"/>
      <rect x="160" y="204" width="168" height="34" rx="4" fill="#E5487A" stroke-width="10"/>
      <path d="M168 176 H300 M168 276 H286 M168 322 H248" fill="none"/>
    </g>
    <circle cx="256" cy="128" r="24" fill="#111111"/>
